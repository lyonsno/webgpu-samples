<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webgpu-samples: packedIntegerDotProduct</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(760px, 100%);
        display: grid;
        gap: 18px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0;
      }
      .segments {
        display: grid;
        grid-template-columns: repeat(3, minmax(72px, 1fr));
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        border-radius: 6px;
        overflow: hidden;
      }
      button {
        min-height: 36px;
        border: 0;
        border-right: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        padding: 0 14px;
        background: color-mix(in srgb, Canvas 92%, CanvasText);
        color: CanvasText;
        font: inherit;
        cursor: pointer;
      }
      button:last-child {
        border-right: 0;
      }
      button[data-selected='true'] {
        background: #006b55;
        color: white;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }
      canvas {
        width: 100%;
        height: 330px;
        display: block;
        border-block: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
      }
      dl {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin: 0;
      }
      dt {
        color: color-mix(in srgb, CanvasText 64%, transparent);
        font-size: 12px;
      }
      dd {
        margin: 4px 0 0;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      [data-fallback-value] {
        min-height: 20px;
        margin: 0;
        color: #b34a00;
        font-size: 13px;
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        header {
          align-items: stretch;
          flex-direction: column;
        }
        dl {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        canvas {
          height: 260px;
        }
      }
    </style>
    <script defer src="main.js" type="module"></script>
    <script defer type="module" src="../../js/iframe-helper.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Packed Integer Dot Product</h1>
        <div class="segments" aria-label="Compute route">
          <button type="button" data-route="auto">Auto</button>
          <button type="button" data-route="packed">Packed</button>
          <button type="button" data-route="scalar">Scalar</button>
        </div>
      </header>
      <canvas aria-label="Signed dot-product result distribution"></canvas>
      <dl>
        <div>
          <dt>Effective route</dt>
          <dd data-route-value>Pending</dd>
        </div>
        <div>
          <dt>Packed support</dt>
          <dd data-support-value>Checking</dd>
        </div>
        <div>
          <dt>Readback time</dt>
          <dd data-duration-value>Pending</dd>
        </div>
        <div>
          <dt>Validation</dt>
          <dd data-validation-value>Pending</dd>
        </div>
      </dl>
      <p data-fallback-value role="status"></p>
    </main>
  </body>
</html>
